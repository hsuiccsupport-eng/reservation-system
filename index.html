<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한성대학교 창업기업육성ICC 예약시스템</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  
  <style>
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; background-color: #f8fafc; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    window.Firebase = {
      initializeApp, getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc,
      getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken
    };
    window.dispatchEvent(new Event('firebase-ready'));
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Lucide Icons (Inline SVG Components) ---
    const IconWrapper = ({ children, className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );

    const Calendar = ({className}) => <IconWrapper className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></IconWrapper>;
    const Monitor = ({className}) => <IconWrapper className={className}><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></IconWrapper>;
    const Box = ({className}) => <IconWrapper className={className}><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></IconWrapper>;
    const CheckCircle = ({className}) => <IconWrapper className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></IconWrapper>;
    const XCircle = ({className}) => <IconWrapper className={className}><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></IconWrapper>;
    const User = ({className}) => <IconWrapper className={className}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></IconWrapper>;
    const Shield = ({className}) => <IconWrapper className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></IconWrapper>;
    const Search = ({className}) => <IconWrapper className={className}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></IconWrapper>;
    const X = ({className}) => <IconWrapper className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></IconWrapper>;
    const AlertCircle = ({className}) => <IconWrapper className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></IconWrapper>;
    const Lock = ({className}) => <IconWrapper className={className}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></IconWrapper>;
    const ChevronLeft = ({className}) => <IconWrapper className={className}><polyline points="15 18 9 12 15 6"></polyline></IconWrapper>;
    const ChevronRight = ({className}) => <IconWrapper className={className}><polyline points="9 18 15 12 9 6"></polyline></IconWrapper>;

    const INITIAL_ITEMS = [
      { id: 1, type: 'space', name: '회의실', description: '회의 및 스터디 목적 (평일 09:00~20:00)', capacity: 8, image: 'https://placehold.co/400x300/1e3a8a/ffffff?text=Meeting+Room', startTime: 9, endTime: 20, isWeekendAllowed: false },
      { id: 2, type: 'equipment', name: '3D 프린터', description: '시제품 제작용 (학기중 09:00~17:00 / 방학중 10:00~16:00)', quantity: 4, image: 'https://placehold.co/400x300/047857/ffffff?text=3D+Printer', startTime: 9, endTime: 17, isWeekendAllowed: false },
      { id: 3, type: 'equipment', name: '재봉틀 및 오버록', description: '의류 및 직물, 가장자리 마감 작업 (학기중 09:00~17:00 / 방학중 10:00~16:00)', quantity: 6, image: 'https://placehold.co/400x300/047857/ffffff?text=Sewing+Machine', startTime: 9, endTime: 17, isWeekendAllowed: false },
      { id: 4, type: 'equipment', name: '컴퓨터자수기', description: '사전교육 이수 필수 (학기중 09:00~17:00 / 방학중 10:00~16:00)', quantity: 1, image: 'https://placehold.co/400x300/b91c1c/ffffff?text=Embroidery', startTime: 9, endTime: 17, isWeekendAllowed: false, requiresTraining: true },
    ];

    const StatusBadge = ({ status }) => {
      switch(status) {
        case 'pending': return <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-yellow-100 text-yellow-800"><AlertCircle className="w-3 h-3 mr-1"/> 승인대기</span>;
        case 'approved': return <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-green-100 text-green-800"><CheckCircle className="w-3 h-3 mr-1"/> 승인완료</span>;
        case 'rejected': return <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-red-100 text-red-800"><XCircle className="w-3 h-3 mr-1"/> 반려됨</span>;
        default: return null;
      }
    };

    const CustomModal = ({ isOpen, title, message, onConfirm, onCancel, isConfirm }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-[100] p-4 backdrop-blur-sm transition-opacity">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-7 transform transition-all">
            <h3 className="text-xl font-bold text-gray-900 mb-3">{title}</h3>
            <p className="text-gray-600 mb-8 whitespace-pre-line leading-relaxed">{message}</p>
            <div className="flex justify-end gap-3">
              {isConfirm && (
                <button onClick={onCancel} className="px-5 py-2.5 rounded-xl text-gray-700 bg-gray-100 hover:bg-gray-200 font-medium transition-colors">취소</button>
              )}
              <button onClick={onConfirm} className="px-5 py-2.5 rounded-xl text-white bg-blue-600 hover:bg-blue-700 font-medium transition-colors shadow-sm">확인</button>
            </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [isFirebaseReady, setIsFirebaseReady] = useState(false);
      const [db, setDb] = useState(null);
      const [appId, setAppId] = useState('reservation-system-v1');

      const [viewMode, setViewMode] = useState('user');
      const [activeTab, setActiveTab] = useState('space');
      const [bookings, setBookings] = useState([]);
      
      const [modalConfig, setModalConfig] = useState({ isOpen: false, title: '', message: '', isConfirm: false, onConfirm: null, onCancel: null });
      const [showAdminLogin, setShowAdminLogin] = useState(false);
      const [adminPwd, setAdminPwd] = useState('');
      
      const [rejectModal, setRejectModal] = useState({ isOpen: false, bookingId: null, reason: '' });

      useEffect(() => {
        const initFirebase = () => {
          const { initializeApp, getFirestore, getAuth, signInAnonymously } = window.Firebase;
          const userFirebaseConfig = {
            apiKey: "AIzaSyBsi1Kr7TpCPgNhffRpUM-RMVJNmyKLQUk",
            authDomain: "reservation-system-dc1fb.firebaseapp.com",
            projectId: "reservation-system-dc1fb",
            storageBucket: "reservation-system-dc1fb.firebasestorage.app",
            messagingSenderId: "546672953445",
            appId: "1:546672953445:web:6a02e87502bf0945d5de8c"
          };
          
          const app = initializeApp(userFirebaseConfig);
          const database = getFirestore(app);
          const auth = getAuth(app);
          
          setDb(database);
          signInAnonymously(auth).catch(err => console.error("Auth err:", err));
          setIsFirebaseReady(true);
        };

        if (window.Firebase) initFirebase();
        else window.addEventListener('firebase-ready', initFirebase);
        return () => window.removeEventListener('firebase-ready', initFirebase);
      }, []);

      useEffect(() => {
        if (!db || !isFirebaseReady) return;
        const { collection, onSnapshot } = window.Firebase;
        const q = collection(db, 'artifacts', appId, 'public', 'data', 'bookings');
        
        const unsubscribe = onSnapshot(q, (snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          data.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
          setBookings(data);
        }, (error) => console.error("Firestore Error:", error));
        return () => unsubscribe();
      }, [db, appId, isFirebaseReady]);

      const showAlert = (title, message) => setModalConfig({ isOpen: true, title, message, isConfirm: false, onConfirm: () => setModalConfig(prev => ({ ...prev, isOpen: false })), onCancel: () => {} });
      const showConfirm = (title, message, onConfirmCallback) => setModalConfig({ isOpen: true, title, message, isConfirm: true, onConfirm: () => { onConfirmCallback(); setModalConfig(prev => ({ ...prev, isOpen: false })); }, onCancel: () => setModalConfig(prev => ({ ...prev, isOpen: false })) });

      const handleAdminLogin = () => {
        if (adminPwd === 'admin1234') { setViewMode('admin'); setShowAdminLogin(false); setAdminPwd(''); }
        else { showAlert('로그인 실패', '비밀번호가 일치하지 않습니다.'); }
      };

      const handleHomeClick = () => {
        setViewMode('user');
        setActiveTab('space');
        setShowAdminLogin(false);
      };

      if (!isFirebaseReady) return <div className="min-h-screen flex items-center justify-center bg-gray-50"><p className="text-gray-500 font-medium">시스템 로딩 중...</p></div>;

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 pb-24">
          <CustomModal {...modalConfig} />
          
          {showAdminLogin && (
            <div className="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
              <div className="bg-white rounded-2xl p-7 shadow-2xl w-full max-w-sm">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-xl font-bold">관리자 접속</h3>
                  <button onClick={() => setShowAdminLogin(false)} className="text-gray-400 hover:text-gray-600 bg-gray-50 hover:bg-gray-100 rounded-full p-1 transition-colors"><X className="w-5 h-5"/></button>
                </div>
                <input type="password" placeholder="비밀번호 입력 (admin1234)" className="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none mb-4 bg-gray-50 transition-all" value={adminPwd} onChange={(e) => setAdminPwd(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleAdminLogin()} />
                <button onClick={handleAdminLogin} className="w-full bg-gray-900 text-white p-4 rounded-xl hover:bg-gray-800 font-bold text-lg transition-colors shadow-md">접속하기</button>
              </div>
            </div>
          )}

          <header className="bg-white shadow-sm sticky top-0 z-30 border-b border-gray-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div 
                className="flex items-center cursor-pointer hover:opacity-80 transition-opacity"
                onClick={handleHomeClick}
                title="첫 화면으로 돌아가기"
              >
                <Calendar className="w-8 h-8 text-blue-600 mr-2 flex-shrink-0" />
                <span className="text-lg sm:text-xl font-extrabold text-gray-900 tracking-tight line-clamp-1">한성대학교 창업기업육성ICC 예약시스템</span>
              </div>
              <div className="flex items-center">
                <div className="hidden sm:flex items-center bg-gray-100 p-1 rounded-lg border border-gray-200">
                  <button onClick={() => setViewMode('user')} className={`px-4 py-1.5 rounded-md text-sm font-bold transition-all flex items-center ${viewMode === 'user' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>
                    <User className="w-4 h-4 mr-1" /> 사용자 모드
                  </button>
                  <button onClick={() => setShowAdminLogin(true)} className={`px-4 py-1.5 rounded-md text-sm font-bold transition-all flex items-center ${viewMode === 'admin' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>
                    <Shield className="w-4 h-4 mr-1" /> 관리자 모드
                  </button>
                </div>
                <button onClick={() => viewMode === 'admin' ? setViewMode('user') : setShowAdminLogin(true)} className="sm:hidden px-3 py-1.5 rounded-lg text-sm font-bold bg-gray-100 text-gray-700">
                  {viewMode === 'admin' ? '사용자' : '관리자'}
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">
            {viewMode === 'user' ? (
              <UserView activeTab={activeTab} setActiveTab={setActiveTab} bookings={bookings} db={db} appId={appId} showAlert={showAlert} showConfirm={showConfirm} INITIAL_ITEMS={INITIAL_ITEMS} />
            ) : (
              <AdminView bookings={bookings} db={db} appId={appId} showConfirm={showConfirm} rejectModal={rejectModal} setRejectModal={setRejectModal} showAlert={showAlert} />
            )}
          </main>
        </div>
      );
    };

    const UserView = ({ activeTab, setActiveTab, bookings, db, appId, showAlert, showConfirm, INITIAL_ITEMS }) => {
      const [selectedItem, setSelectedItem] = useState(null);
      const [isModalOpen, setIsModalOpen] = useState(false);
      
      const filteredItems = INITIAL_ITEMS.filter(item => item.type === (activeTab === 'space' ? 'space' : 'equipment'));

      return (
        <div className="space-y-6 md:space-y-8">
          <div className="bg-blue-600 rounded-2xl p-6 md:p-8 text-white shadow-lg flex items-center justify-between">
            <div>
              <h2 className="text-2xl md:text-3xl font-bold mb-2 break-keep">필요한 공간과 장비를 예약하세요</h2>
              <p className="text-sm md:text-base text-blue-100 break-keep">원하는 날짜와 시간을 선택하고 간편하게 신청하세요.</p>
            </div>
            <Calendar className="w-24 h-24 text-blue-400 opacity-50 hidden md:block flex-shrink-0" />
          </div>

          <div className="flex overflow-x-auto hide-scrollbar space-x-2 sm:space-x-4 border-b border-gray-200">
            <button onClick={() => {setActiveTab('space'); setSelectedItem(null);}} className={`flex items-center whitespace-nowrap flex-shrink-0 pb-3 sm:pb-4 px-2 sm:px-4 text-sm sm:text-base md:text-lg font-bold border-b-2 transition-colors ${activeTab === 'space' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
              <Box className="w-4 h-4 sm:w-5 sm:h-5 inline-block mr-1.5 sm:mr-2" /> 공간 예약
            </button>
            <button onClick={() => {setActiveTab('equipment'); setSelectedItem(null);}} className={`flex items-center whitespace-nowrap flex-shrink-0 pb-3 sm:pb-4 px-2 sm:px-4 text-sm sm:text-base md:text-lg font-bold border-b-2 transition-colors ${activeTab === 'equipment' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
              <Monitor className="w-4 h-4 sm:w-5 sm:h-5 inline-block mr-1.5 sm:mr-2" /> 기자재 예약
            </button>
            <button onClick={() => {setActiveTab('lookup'); setSelectedItem(null);}} className={`flex items-center whitespace-nowrap flex-shrink-0 pb-3 sm:pb-4 px-2 sm:px-4 text-sm sm:text-base md:text-lg font-bold border-b-2 transition-colors ${activeTab === 'lookup' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
              <Search className="w-4 h-4 sm:w-5 sm:h-5 inline-block mr-1.5 sm:mr-2" /> 예약 조회
            </button>
          </div>

          {activeTab !== 'lookup' ? (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {filteredItems.map(item => (
                <div key={item.id} className="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm hover:shadow-md transition-shadow flex flex-col">
                  <img src={item.image} alt={item.name} className="w-full h-48 object-cover" />
                  <div className="p-5 flex flex-col flex-grow">
                    <div className="flex justify-between items-start mb-2">
                      <h3 className="text-xl font-bold text-gray-900">{item.name}</h3>
                      <span className="text-sm text-gray-500 bg-gray-100 px-2 py-1 rounded">
                        {item.type === 'space' ? `최대 ${item.capacity}인` : `총 ${item.quantity}개`}
                      </span>
                    </div>
                    <p className="text-gray-600 text-sm mb-4 flex-grow whitespace-pre-line">{item.description}</p>
                    <button onClick={() => { setSelectedItem(item); setIsModalOpen(true); }} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition-colors mt-auto shadow-sm">
                      예약 신청하기
                    </button>
                  </div>
                </div>
              ))}
            </div>
          ) : (
            <LookupForm bookings={bookings} db={db} appId={appId} showAlert={showAlert} showConfirm={showConfirm} />
          )}

          {isModalOpen && selectedItem && (
            <BookingModal item={selectedItem} bookings={bookings} db={db} appId={appId} showAlert={showAlert} onClose={() => setIsModalOpen(false)} setActiveTab={setActiveTab} />
          )}

          {activeTab !== 'lookup' && (
            <div className="mt-12">
              <BookingCalendar bookings={bookings} />
            </div>
          )}
        </div>
      );
    };

    const BookingModal = ({ item, bookings, db, appId, showAlert, onClose, setActiveTab }) => {
      const [formData, setFormData] = useState({ date: '', startTime: '', endTime: '', companyName: '', applicantName: '', phone: '', pin: '', purpose: '', agreed: false });

      const isEmbroidery = item.name === '컴퓨터자수기';
      
      const isVacation = (dateStr) => {
        if (!dateStr) return false;
        const dateVal = dateStr.replace(/-/g, ''); 
        return dateVal >= '20260622' && dateVal <= '20260814';
      };

      const handlePhoneChange = (e) => {
        let val = e.target.value.replace(/[^0-9]/g, '');
        if (val.length > 11) val = val.slice(0, 11);
        let formatted = val;
        if (val.length > 3 && val.length <= 7) formatted = `${val.slice(0, 3)}-${val.slice(3)}`;
        else if (val.length > 7) formatted = `${val.slice(0, 3)}-${val.slice(3, 7)}-${val.slice(7)}`;
        setFormData(p => ({ ...p, phone: formatted }));
      };

      const getOperatingHours = () => {
        let start = item.startTime;
        let end = item.endTime;
        if (item.type === 'equipment' && isVacation(formData.date)) {
          start = 10;
          end = 16;
        }
        return { start, end };
      };

      const availableStartTimes = useMemo(() => {
        if (!formData.date) return [];
        const opHours = getOperatingHours();
        const allTimes = [];
        for (let i = opHours.start; i < opHours.end; i++) allTimes.push(`${i.toString().padStart(2, '0')}:00`);

        const dayBookings = bookings.filter(b => b.itemName === item.name && b.date === formData.date && b.status !== 'rejected' && b.status !== 'cancelled');
        const maxCap = item.type === 'space' ? 1 : item.quantity;

        return allTimes.filter(t => {
          const tVal = parseInt(t.split(':')[0]);
          const overlappingCount = dayBookings.filter(b => {
            const bStart = parseInt(b.startTime.split(':')[0]);
            const bEnd = parseInt(b.endTime.split(':')[0]);
            return tVal >= bStart && tVal < bEnd;
          }).length;
          return overlappingCount < maxCap;
        });
      }, [formData.date, item, bookings]);

      const availableEndTimes = useMemo(() => {
        if (!formData.startTime) return [];
        const startVal = parseInt(formData.startTime.split(':')[0]);
        const opHours = getOperatingHours();
        
        const dayBookings = bookings.filter(b => b.itemName === item.name && b.date === formData.date && b.status !== 'rejected' && b.status !== 'cancelled');
        const maxCap = item.type === 'space' ? 1 : item.quantity;
        
        let maxEndVal = opHours.end;
        for (let i = startVal + 1; i < opHours.end; i++) {
          const overlappingCount = dayBookings.filter(b => {
            const bStart = parseInt(b.startTime.split(':')[0]);
            const bEnd = parseInt(b.endTime.split(':')[0]);
            return i >= bStart && i < bEnd;
          }).length;
          if (overlappingCount >= maxCap) {
            maxEndVal = i;
            break;
          }
        }
        
        const endTimes = [];
        for (let i = startVal + 1; i <= maxEndVal; i++) endTimes.push(`${i.toString().padStart(2, '0')}:00`);
        return endTimes;
      }, [formData.startTime, formData.date, item, bookings]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        const { date, startTime, endTime, companyName, applicantName, phone, pin, purpose, agreed } = formData;
        
        if (!date || !startTime || !endTime || !companyName || !applicantName || !phone || !pin || !purpose) { showAlert('알림', '모든 필수 항목을 입력해주세요.'); return; }
        if (pin.length !== 4) { showAlert('알림', '비밀번호는 4자리 숫자로 설정해주세요.'); return; }
        if (isEmbroidery && !agreed) { showAlert('알림', '컴퓨터자수기는 사전 교육 이수 체크가 필수입니다.'); return; }

        const { addDoc, collection } = window.Firebase;
        try {
          await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'bookings'), {
            type: item.type, itemId: item.id, itemName: item.name, date, startTime, endTime, companyName, applicantName, phone, pin, purpose,
            status: 'pending', createdAt: new Date().toISOString()
          });
          showAlert('신청 완료', '예약 신청이 성공적으로 접수되었습니다.\n관리자의 승인 후 최종 확정됩니다.');
          onClose();
          setActiveTab('lookup');
        } catch (err) { showAlert('오류', '예약 신청 중 문제가 발생했습니다.'); }
      };

      const inputClass = "w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all";

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto">
          <div className="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div className="fixed inset-0 bg-gray-900 bg-opacity-75 transition-opacity" onClick={onClose}></div>
            <span className="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            <div className="inline-block align-bottom bg-white rounded-2xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-xl sm:w-full">
              <div className="bg-white px-6 py-6 border-b border-gray-100 flex justify-between items-center">
                <h3 className="text-xl font-bold text-gray-900">예약 신청서 작성</h3>
                <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><X className="w-6 h-6" /></button>
              </div>
              
              <div className="p-6">
                <div className="bg-blue-50 rounded-xl p-4 mb-6 flex items-center border border-blue-100">
                  <div className="w-16 h-16 rounded-lg overflow-hidden mr-4 flex-shrink-0 shadow-sm"><img src={item.image} alt={item.name} className="w-full h-full object-cover" /></div>
                  <div>
                    <span className="text-xs font-bold text-blue-700 bg-blue-100 px-2.5 py-1 rounded-md mb-1.5 inline-block">{item.type === 'space' ? '공간' : '기자재'}</span>
                    <p className="font-extrabold text-gray-900 text-lg">{item.name}</p>
                  </div>
                </div>

                <form onSubmit={handleSubmit} className="space-y-5" autoComplete="off">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">신청기업명 <span className="text-red-500">*</span></label>
                      <input type="text" required value={formData.companyName} onChange={(e) => setFormData({...formData, companyName: e.target.value})} className={inputClass} placeholder="소속 입력" />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">신청자명 <span className="text-red-500">*</span></label>
                      <input type="text" required value={formData.applicantName} onChange={(e) => setFormData({...formData, applicantName: e.target.value})} className={inputClass} placeholder="이름 입력" />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">휴대전화번호 <span className="text-red-500">*</span></label>
                      <input type="tel" required value={formData.phone} onChange={handlePhoneChange} maxLength={13} className={inputClass} placeholder="010-0000-0000" />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">조회용 비밀번호 <span className="text-red-500">*</span></label>
                      <input 
                        type="text" required value={formData.pin} 
                        onChange={(e) => setFormData({...formData, pin: e.target.value.replace(/[^0-9]/g, '').slice(0,4)})} 
                        maxLength={4} pattern="\d{4}" title="숫자 4자리"
                        className={inputClass} placeholder="숫자 4자리"
                        style={{ WebkitTextSecurity: 'disc' }}
                        inputMode="numeric"
                        autoComplete="new-password"
                      />
                    </div>
                  </div>

                  {item.type === 'equipment' && formData.date && isVacation(formData.date) && (
                    <div className="text-sm text-blue-700 bg-blue-50 p-3 rounded-lg font-bold border border-blue-100 flex items-center mt-2">
                      <AlertCircle className="w-4 h-4 mr-2 flex-shrink-0" />
                      방학 기간(6.22~8.14) 기자재 단축 운영 적용 중 (10:00 ~ 16:00)
                    </div>
                  )}

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-5 pt-3 border-t border-gray-100">
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">예약 날짜 <span className="text-red-500">*</span></label>
                      <input type="date" required value={formData.date} onChange={(e) => { const day = new Date(e.target.value).getDay(); if(day===0||day===6){showAlert('알림','주말은 예약할 수 없습니다.');return;} setFormData({...formData, date: e.target.value, startTime: '', endTime: ''}); }} min={new Date().toISOString().split('T')[0]} className={inputClass} />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">시작 시간 <span className="text-red-500">*</span></label>
                      <select required value={formData.startTime} onChange={(e) => setFormData({...formData, startTime: e.target.value, endTime: ''})} disabled={!formData.date || availableStartTimes.length===0} className={`${inputClass} disabled:opacity-50`}>
                        <option value="">{formData.date ? (availableStartTimes.length>0?'선택':'마감') : '날짜 선택'}</option>
                        {availableStartTimes.map(t => <option key={t} value={t}>{t}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">종료 시간 <span className="text-red-500">*</span></label>
                      <select required value={formData.endTime} onChange={(e) => setFormData({...formData, endTime: e.target.value})} disabled={!formData.startTime} className={`${inputClass} disabled:opacity-50`}>
                        <option value="">선택</option>
                        {availableEndTimes.map(t => <option key={t} value={t}>{t}</option>)}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-1">사용 목적 <span className="text-red-500">*</span></label>
                    <textarea required value={formData.purpose} onChange={(e) => setFormData({...formData, purpose: e.target.value})} rows="2" className={`${inputClass} resize-none`} placeholder="상세한 사용 목적을 적어주세요."></textarea>
                  </div>

                  {isEmbroidery && (
                    <div className="bg-amber-50 p-4 rounded-xl border border-amber-200 flex items-start gap-3">
                      <input type="checkbox" id="edu" checked={formData.agreed} onChange={(e) => setFormData({...formData, agreed: e.target.checked})} className="mt-1 w-4 h-4 text-blue-600 rounded" />
                      <label htmlFor="edu" className="text-sm text-amber-900 cursor-pointer">
                        <span className="font-bold block mb-1">⚠️ 필수 확인</span>
                        컴퓨터자수기는 사전 교육 이수자만 이용 가능합니다. 본인은 사전 교육을 이수하였음을 확인합니다.
                      </label>
                    </div>
                  )}
                  
                  <div className="pt-5 border-t border-gray-100 flex justify-end gap-3">
                    <button type="button" onClick={onClose} className="px-5 py-3 border border-gray-300 rounded-xl text-sm font-bold text-gray-700 hover:bg-gray-50 transition-colors">취소</button>
                    <button type="submit" className="px-5 py-3 bg-blue-600 text-white rounded-xl text-sm font-bold hover:bg-blue-700 transition-colors shadow-md">신청서 제출</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const LookupForm = ({ bookings, db, appId, showAlert, showConfirm }) => {
      const [searchName, setSearchName] = useState('');
      const [searchPin, setSearchPin] = useState('');
      const [myBookings, setMyBookings] = useState([]);
      const [searched, setSearched] = useState(false);

      const handleSearch = (e) => {
        e.preventDefault();
        if (!searchName || !searchPin) { showAlert('알림', '신청자명과 비밀번호를 모두 입력해주세요.'); return; }
        const results = bookings.filter(b => b.applicantName === searchName && b.pin === searchPin);
        setMyBookings(results);
        setSearched(true);
      };

      const handleCancel = (id) => {
        showConfirm('예약 취소', '정말 이 예약을 취소하시겠습니까?\n취소 후에는 복구할 수 없습니다.', async () => {
          const { updateDoc, doc } = window.Firebase;
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bookings', id), { status: 'cancelled' });
          showAlert('취소 완료', '예약이 취소되었습니다.');
          setMyBookings(prev => prev.map(b => b.id === id ? { ...b, status: 'cancelled' } : b));
        });
      };

      return (
        <div className="space-y-10">
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-10 mt-6">
            <h3 className="text-2xl font-bold text-gray-900 mb-6 flex items-center gap-2"><Search className="w-6 h-6 text-blue-600"/> 내 예약 조회</h3>
            <form onSubmit={handleSearch} className="bg-gray-50 p-6 rounded-2xl border border-gray-100 flex flex-col md:flex-row gap-4 items-end shadow-sm" autoComplete="off">
              <div className="flex-1 w-full space-y-2">
                <label className="text-sm font-bold text-gray-700">신청자명</label>
                <input type="text" value={searchName} onChange={(e) => setSearchName(e.target.value)} className="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="이름 입력" />
              </div>
              <div className="flex-1 w-full space-y-2">
                <label className="text-sm font-bold text-gray-700">비밀번호 (4자리)</label>
                <input 
                  type="text" value={searchPin} onChange={(e) => setSearchPin(e.target.value.replace(/[^0-9]/g, '').slice(0,4))} 
                  className="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="숫자 4자리"
                  style={{ WebkitTextSecurity: 'disc' }} inputMode="numeric" autoComplete="new-password"
                />
              </div>
              <button type="submit" className="w-full md:w-auto px-10 py-4 bg-gray-900 text-white font-bold rounded-xl hover:bg-gray-800 transition-colors shadow-md">조회하기</button>
            </form>

            {searched && (
              <div className="mt-8 space-y-4">
                <h3 className="text-lg font-bold text-gray-900 border-b border-gray-200 pb-3">조회 결과</h3>
                {myBookings.length === 0 ? (
                  <div className="py-12 text-center text-gray-500 bg-gray-50 rounded-2xl border border-dashed border-gray-200 font-medium">일치하는 예약 내역이 없습니다.</div>
                ) : (
                  <div className="space-y-4">
                    {myBookings.map(b => (
                      <div key={b.id} className="flex flex-col md:flex-row md:items-center justify-between p-6 border border-gray-200 rounded-2xl hover:border-blue-300 hover:shadow-md transition-all gap-4 bg-white">
                        <div className="space-y-2">
                          <div className="flex items-center gap-3 mb-1">
                            <StatusBadge status={b.status} />
                            <span className="font-extrabold text-gray-900 text-lg">{b.companyName}</span>
                            <span className="text-sm font-medium text-gray-500 border-l border-gray-300 pl-3">{b.itemName}</span>
                          </div>
                          <div className="text-sm font-medium text-gray-600">{b.date} &nbsp;|&nbsp; {b.startTime} ~ {b.endTime}</div>
                          {b.status === 'rejected' && b.rejectReason && (
                            <div className="text-sm font-bold text-red-600 bg-red-50 p-2 rounded-lg mt-2 break-all">반려 사유: {b.rejectReason}</div>
                          )}
                        </div>
                        {(b.status === 'pending' || b.status === 'approved') && (
                          <button onClick={() => handleCancel(b.id)} className="px-6 py-3 text-sm text-red-600 bg-red-50 hover:bg-red-100 rounded-xl font-bold transition-colors">예약 취소</button>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    };

    const AdminView = ({ bookings, db, appId, showConfirm, rejectModal, setRejectModal, showAlert }) => {
      const handleApprove = async (id) => {
        const { updateDoc, doc } = window.Firebase;
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bookings', id), { status: 'approved' });
      };

      const executeReject = async () => {
        if (!rejectModal.reason.trim()) { showAlert('알림', '반려 사유를 입력해주세요.'); return; }
        const { updateDoc, doc } = window.Firebase;
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bookings', rejectModal.bookingId), { status: 'rejected', rejectReason: rejectModal.reason });
        setRejectModal({ isOpen: false, bookingId: null, reason: '' });
      };

      const handleDelete = (id) => {
        showConfirm('예약 삭제', '이 예약을 완전히 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.', async () => {
          const { deleteDoc, doc } = window.Firebase;
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bookings', id));
        });
      };

      return (
        <div className="bg-white rounded-3xl shadow-sm border border-gray-100 p-6 md:p-10">
          <div className="flex items-center justify-between mb-8 border-b border-gray-100 pb-5">
            <h2 className="text-2xl font-extrabold text-gray-900">전체 예약 통합 관리</h2>
            <div className="text-sm font-bold text-blue-600 bg-blue-50 px-4 py-2 rounded-lg">승인 대기: {bookings.filter(b=>b.status==='pending').length}건</div>
          </div>
          
          <div className="overflow-x-auto rounded-xl border border-gray-200">
            <table className="w-full text-left text-sm text-gray-600">
              <thead className="text-xs text-gray-700 uppercase bg-gray-50 border-b border-gray-200 font-bold">
                <tr>
                  <th className="px-5 py-4">상태</th>
                  <th className="px-5 py-4">날짜/시간</th>
                  <th className="px-5 py-4">항목</th>
                  <th className="px-5 py-4">신청정보</th>
                  <th className="px-5 py-4 text-right">관리</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-100">
                {bookings.length === 0 ? (
                  <tr><td colSpan="5" className="px-5 py-12 text-center text-gray-500 font-medium">예약 내역이 없습니다.</td></tr>
                ) : bookings.map(b => (
                  <tr key={b.id} className="hover:bg-gray-50 transition-colors">
                    <td className="px-5 py-4"><StatusBadge status={b.status} /></td>
                    <td className="px-5 py-4 whitespace-nowrap">
                      <div className="font-bold text-gray-900 text-sm mb-1">{b.date}</div>
                      <div className="text-gray-500 text-xs font-medium">{b.startTime} ~ {b.endTime}</div>
                    </td>
                    <td className="px-5 py-4 font-bold text-gray-900">{b.itemName}</td>
                    <td className="px-5 py-4">
                      <div className="font-bold text-gray-900 text-sm mb-1">{b.companyName} <span className="text-xs font-medium text-gray-500">({b.applicantName})</span></div>
                      <div className="text-gray-500 text-xs font-medium">{b.phone}</div>
                    </td>
                    <td className="px-5 py-4 text-right whitespace-nowrap">
                      <span className="flex space-x-2 justify-end">
                        {b.status === 'pending' && (
                          <span className="flex space-x-2">
                            <button onClick={() => handleApprove(b.id)} className="px-4 py-2 bg-blue-600 text-white rounded-lg shadow-sm hover:bg-blue-700 text-xs font-bold transition-colors">승인</button>
                            <button onClick={() => setRejectModal({ isOpen: true, bookingId: b.id, reason: '' })} className="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg shadow-sm hover:bg-gray-300 text-xs font-bold transition-colors">반려</button>
                          </span>
                        )}
                        <button onClick={() => handleDelete(b.id)} className="px-4 py-2 border border-red-200 text-red-600 bg-red-50 hover:bg-red-100 rounded-lg shadow-sm text-xs font-bold transition-colors">삭제</button>
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* 반려 사유 입력 모달 */}
          {rejectModal.isOpen && (
            <div className="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
              <div className="bg-white rounded-2xl p-7 shadow-2xl w-full max-w-md">
                <h3 className="text-xl font-bold mb-2">예약 반려</h3>
                <p className="text-sm text-gray-500 mb-4">사용자에게 표시될 반려 사유를 입력해주세요.</p>
                <textarea className="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-red-500 outline-none mb-4 resize-none" rows="3" placeholder="반려 사유 입력" value={rejectModal.reason} onChange={(e) => setRejectModal(p => ({...p, reason: e.target.value}))}></textarea>
                <div className="flex justify-end gap-3">
                  <button onClick={() => setRejectModal({ isOpen: false, bookingId: null, reason: '' })} className="px-5 py-2.5 bg-gray-100 text-gray-700 rounded-xl font-bold">취소</button>
                  <button onClick={executeReject} className="px-5 py-2.5 bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 shadow-md">반려 확정</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const BookingCalendar = ({ bookings }) => {
      const [currentMonth, setCurrentMonth] = useState(new Date()); 
      const [selectedBooking, setSelectedBooking] = useState(null);

      const nextMonth = () => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1));
      const prevMonth = () => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1));

      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      
      const blanks = Array.from({ length: firstDay }, (_, i) => i);
      const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);

      const approvedBookings = bookings.filter(b => b.status === 'approved');

      return (
        <div className="border border-gray-200 rounded-2xl overflow-hidden bg-white shadow-sm mt-8">
          <div className="bg-gray-50 p-5 border-b border-gray-200 flex justify-between items-center">
             <button onClick={prevMonth} className="p-2 hover:bg-gray-200 rounded-full transition-colors"><ChevronLeft className="w-5 h-5 text-gray-600"/></button>
             <div className="font-extrabold text-gray-900 text-xl">{year}년 {month + 1}월</div>
             <button onClick={nextMonth} className="p-2 hover:bg-gray-200 rounded-full transition-colors"><ChevronRight className="w-5 h-5 text-gray-600"/></button>
          </div>
          <div className="grid grid-cols-7 text-center text-sm font-bold text-gray-500 border-b border-gray-200 bg-white">
            {['일', '월', '화', '수', '목', '금', '토'].map((d, i) => (
              <div key={d} className={`py-3 ${i===0 ? 'text-red-500' : i===6 ? 'text-blue-500' : ''}`}>{d}</div>
            ))}
          </div>
          <div className="grid grid-cols-7 auto-rows-fr bg-gray-50/30">
            {blanks.map(b => <div key={`blank-${b}`} className="min-h-[120px] border-b border-r border-gray-100"></div>)}
            {days.map(day => {
              const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
              const dayBookings = approvedBookings.filter(b => b.date === dateStr);
              const isToday = new Date().getDate() === day && new Date().getMonth() === month && new Date().getFullYear() === year;
              
              return (
                <div key={day} className="min-h-[120px] border-b border-r border-gray-100 p-1.5 flex flex-col bg-white">
                  <span className={`text-xs font-bold p-1 ${isToday ? 'bg-blue-600 text-white rounded-full w-7 h-7 flex items-center justify-center mx-auto mb-1 shadow-sm' : 'text-gray-700 text-center block mb-1'}`}>
                    {day}
                  </span>
                  <div className="flex flex-col gap-1.5 overflow-y-auto hide-scrollbar flex-1 mt-1">
                    {dayBookings.map(b => (
                      <div 
                        key={b.id} 
                        onClick={(e) => { e.stopPropagation(); setSelectedBooking(b); }}
                        className="text-[11px] font-medium leading-tight px-2 py-1.5 bg-blue-50 border border-blue-100 text-blue-800 rounded-md truncate cursor-pointer hover:bg-blue-100 shadow-sm transition-colors" 
                        title="클릭하여 예약 상세 보기"
                      >
                        {b.companyName}({b.itemName})
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>

          {/* 달력 예약 상세 모달 팝업 */}
          {selectedBooking && (
            <div className="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-[80] p-4 backdrop-blur-sm" onClick={() => setSelectedBooking(null)}>
              <div className="bg-white rounded-2xl p-7 shadow-2xl w-full max-w-sm" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center mb-5 border-b border-gray-100 pb-3">
                  <h3 className="text-xl font-extrabold text-gray-900">예약 상세 정보</h3>
                  <button onClick={() => setSelectedBooking(null)} className="text-gray-400 hover:text-gray-600 bg-gray-50 hover:bg-gray-100 rounded-full p-1 transition-colors"><X className="w-5 h-5"/></button>
                </div>
                
                <div className="space-y-4 text-sm text-gray-700">
                  <div className="flex justify-between items-center bg-blue-50 p-3 rounded-lg border border-blue-100">
                    <span className="font-bold text-blue-800">예약항목</span>
                    <span className="font-extrabold text-blue-900">{selectedBooking.itemName}</span>
                  </div>
                  <p className="flex justify-between items-center px-1"><span className="font-bold text-gray-500">신청기업</span> <span className="font-bold text-gray-900">{selectedBooking.companyName}</span></p>
                  <p className="flex justify-between items-center px-1"><span className="font-bold text-gray-500">신청자명</span> <span className="font-bold text-gray-900">{selectedBooking.applicantName.replace(/(?<=^.)./, '*')}</span></p>
                  <p className="flex justify-between items-center px-1"><span className="font-bold text-gray-500">이용일자</span> <span className="font-bold text-gray-900">{selectedBooking.date}</span></p>
                  <p className="flex justify-between items-center px-1"><span className="font-bold text-gray-500">이용시간</span> <span className="font-bold text-gray-900">{selectedBooking.startTime} ~ {selectedBooking.endTime}</span></p>
                  
                  <div className="mt-5 pt-4 border-t border-gray-100">
                    <p className="font-bold text-gray-500 mb-2 px-1">사용 목적</p>
                    <div className="bg-gray-50 p-4 rounded-xl border border-gray-100 text-gray-800 text-sm whitespace-pre-line leading-relaxed">
                      {selectedBooking.purpose}
                    </div>
                  </div>
                </div>

                <button onClick={() => setSelectedBooking(null)} className="mt-6 w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 transition-colors shadow-md">
                  닫기
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
